<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extended Research Index — ReincarnatedAI</title><meta name="description" content="An expanding, source-backed index of research notes, cases, methods, and open questions in consciousness and survival research."><link rel="canonical" href="https://reincarnatedai.com/research"><meta property="og:type" content="website"><meta property="og:title" content="Extended Research Index — ReincarnatedAI"><meta property="og:description" content="Source-backed research notes and case files."><meta property="og:url" content="https://reincarnatedai.com/research"><meta property="og:image" content="https://reincarnatedai.com/og-image.jpg"><link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/research.css"><script src="/assets/safe.js"></script></head><body><nav><a href="/" class="logo">ReincarnatedAI</a><div class="links"><a href="/start-here">Start Here</a><a href="/cases">Cases</a><a href="/research">Research</a><a href="/library">Sources</a><a href="/methodology">Methodology</a></div></nav><section class="hero"><div class="hero-content"><div class="eyebrow">Research Desk</div><h1>Extended Research</h1><p>New source-backed notes and case files, organized by what is observed, what is inferred, and what remains open.</p></div></section><main class="section narrow"><div class="filter-strip"><label for="researchQuery">Search the index</label><input id="researchQuery" type="search" placeholder="Try terminal lucidity, UVA, IIT…" aria-label="Search extended research"><select id="researchDomain" aria-label="Filter by domain"><option value="">All domains</option></select><select id="researchKind" aria-label="Filter by record type"><option value="">All record types</option></select></div><div id="researchCount" class="lede"></div><div id="researchCards" class="grid"></div></main><footer class="footer"><span>Every record identifies its source and confidence boundary.</span><span><a href="/editorial-policy">Editorial policy</a> · <a href="/corrections">Corrections</a></span></footer><script type="module">
import { extendedResearch } from '/data/extended-research-data.js';
const q=document.getElementById('researchQuery'), domain=document.getElementById('researchDomain'), kind=document.getElementById('researchKind'), cards=document.getElementById('researchCards'), count=document.getElementById('researchCount');
for(const value of [...new Set(extendedResearch.map(x=>x.domain))].sort()) domain.insertAdjacentHTML('beforeend',`<option>${RaiSafe.escape(value)}</option>`);
for(const value of [...new Set(extendedResearch.map(x=>x.kind))].sort()) kind.insertAdjacentHTML('beforeend',`<option>${RaiSafe.escape(value)}</option>`);
function render(){const query=q.value.trim().toLowerCase();const rows=extendedResearch.filter(x=>(!domain.value||x.domain===domain.value)&&(!kind.value||x.kind===kind.value)&&(!query||[x.title,x.domain,x.kind,x.tier,x.summary,x.source].join(' ').toLowerCase().includes(query)));count.textContent=`${rows.length} research record${rows.length===1?'':'s'} shown`;cards.replaceChildren();for(const x of rows){const article=document.createElement('article');article.className='card';const meta=document.createElement('div');meta.className='meta';meta.textContent=`${x.kind} · ${x.domain} · ${x.year}`;const h=document.createElement('h3');h.textContent=x.title;const p=document.createElement('p');p.textContent=x.summary;const tier=document.createElement('div');tier.className='strength-note';tier.textContent=x.tier;const source=document.createElement('a');source.href=x.url;source.textContent=`Source: ${x.source} →`;source.rel=x.url.startsWith('http')?'noopener':'';if(x.url.startsWith('http'))source.target='_blank';article.append(meta,h,p,tier,source);cards.append(article);}}
for(const el of [q,domain,kind])el.addEventListener('input',render);render();
</script><script src="/assets/ui.js" defer></script><script src="/assets/chat-widget.js?v=4" defer></script></body></html>
