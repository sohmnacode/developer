name: Researcher profile links
on:
  schedule:
    - cron: '15 13 * * 1'
  workflow_dispatch:
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check researcher profile URLs
        run: python3 scripts/check-researcher-links.py
