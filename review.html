<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviewer Workspace — ReincarnatedAI</title><meta name="description" content="Transparent reviewer annotations and evidence provenance."><link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/research.css"></head><body><nav><a href="/" class="logo">ReincarnatedAI</a><div class="links"><a href="/research">Research</a><a href="/corrections">Corrections</a><a href="/submit">Submit</a></div></nav><main class="section narrow"><div class="eyebrow">Editorial review</div><h1>Reviewer annotations</h1><p class="lede">A transparent layer for recording what was checked, by whom, and what remains uncertain.</p><article class="card"><label for="record">Record</label><select id="record"><option>UVA CORT archive</option><option>AWARE II</option><option>Pollock Twins</option></select><label for="note">Annotation</label><textarea id="note" rows="5" placeholder="Add a source check, limitation, or correction…" aria-label="Reviewer annotation"></textarea><button id="save" type="button">Save annotation</button><div id="status" class="strength-note">No annotations saved in this browser.</div></article></main><script>const k='rai-review-notes';save.addEventListener('click',()=>{const rows=JSON.parse(localStorage.getItem(k)||'[]');rows.push({record:record.value,note:note.value,reviewed:new Date().toISOString()});localStorage.setItem(k,JSON.stringify(rows));status.textContent=`Saved ${rows.length} annotation${rows.length===1?'':'s'} locally.`;note.value='';});</script><script src="/assets/ui.js" defer></script></body></html>
